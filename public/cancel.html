<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pago cancelado | Herencia Jeans</title>
    <style>
      :root {
        --bg: #111111;
        --panel: #1a1a1a;
        --text: #f3efe7;
        --muted: #d0c8b5;
        --sand: #d8b86b;
        --danger: #ff6b6b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #111111, #1a1a1a 40%, #111111);
        color: var(--text);
      }

      .card {
        width: min(560px, calc(100vw - 32px));
        background: rgba(26, 26, 26, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 22px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(255, 107, 107, 0.12);
        color: var(--danger);
        font-size: 2rem;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.5rem);
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
        font-size: 1rem;
      }

      .actions {
        margin-top: 26px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      a.button {
        display: inline-block;
        text-decoration: none;
        background: var(--sand);
        color: #111111;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">✕</div>
      <h1>Pago cancelado</h1>
      <p>
        El proceso fue cancelado antes de completarse la compra. Podés volver a intentar o seguir navegando por la tienda.
      </p>
      <div class="actions">
        <a class="button" href="/">Volver a la tienda</a>
      </div>
    </main>
  </body>
</html>
