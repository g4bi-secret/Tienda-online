<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pago confirmado</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f0f11;
        color: #f5f1ea;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .box {
        max-width: 520px;
        text-align: center;
        background: #17181c;
        padding: 32px;
        border-radius: 24px;
        border: 1px solid rgba(255,255,255,.08);
      }
      h1 { color: #e2c792; }
      a {
        display: inline-block;
        margin-top: 18px;
        color: #121212;
        background: linear-gradient(135deg, #d4af37 0%, #e2c792 52%, #f7e7c4 100%);
        text-decoration: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>¡Pago confirmado!</h1>
      <p>Tu compra fue procesada correctamente con Mercado Pago.</p>
      <p>En breve el dueño recibirá la notificación del pedido.</p>
      <a href="/">Volver a la tienda</a>
    </div>
  </body>
</html>
