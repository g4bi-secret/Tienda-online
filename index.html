    <script>
      const ownerEmail = 'herenciajeans2026@gmail.com';
      const ownerPhone = '5493515060531';
      const ownerAlias = 'Montesion.24';
      const ownerName = 'Brian Salomon Schmidt';

      const products = [
        { id: 1, name: 'Jeans Classic Blue', category: 'Jeans & Pantalones', price: 24990, image: 'https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=900&q=80' },
        { id: 2, name: 'Chomba Essential', category: 'Remeras & Tops', price: 12990, image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80' },
        { id: 3, name: 'Bomber Vintage', category: 'Abrigos & Jackets', price: 33990, image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80' },
        { id: 4, name: 'Pantalón Cargo', category: 'Jeans & Pantalones', price: 21990, image: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=900&q=80' },
        { id: 5, name: 'Camiseta Oversize', category: 'Remeras & Tops', price: 11990, image: 'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=80' },
        { id: 6, name: 'Jacket Street', category: 'Abrigos & Jackets', price: 35990, image: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=900&q=80' },
        { id: 7, name: 'Jeans Slim Noir', category: 'Jeans & Pantalones', price: 26990, image: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80' },
        { id: 8, name: 'Top Everyday', category: 'Remeras & Tops', price: 10990, image: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80' },
      ];

      const state = {
        activeCategory: 'Todos',
        cart: [],
      };

      const productGrid = document.getElementById('productGrid');
      const cartItems = document.getElementById('cartItems');
      const cartModal = document.getElementById('cartModal');
      const cartCount = document.getElementById('cartCount');
      const totalPrice = document.getElementById('totalPrice');
      const subtotalValue = document.getElementById('subtotalValue');
      const discountValue = document.getElementById('discountValue');
      const totalValue = document.getElementById('totalValue');
      const customerName = document.getElementById('customerName');
      const paymentMethod = document.getElementById('paymentMethod');
      const deliveryMethod = document.getElementById('deliveryMethod');
      const transferInfo = document.getElementById('transferInfo');
      const cardInfo = document.getElementById('cardInfo');

      function formatPrice(value) {
        return new Intl.NumberFormat('es-AR', {
          style: 'currency',
          currency: 'ARS',
          maximumFractionDigits: 0,
        }).format(value);
      }

      function getDiscountPercent() {
        const method = paymentMethod.value;
        if (method === 'efectivo') return 15;
        if (method === 'transferencia') return 10;
        return 0;
      }

      function getCartItemsCount() {
        return state.cart.reduce((sum, item) => sum + item.quantity, 0);
      }

      function togglePaymentDetails() {
        const method = paymentMethod.value;
        transferInfo.classList.toggle('hidden', method !== 'transferencia');
        cardInfo.classList.toggle('hidden', method !== 'tarjeta');
      }

      function renderProducts() {
        const filtered = state.activeCategory === 'Todos'
          ? products
          : products.filter((product) => product.category === state.activeCategory);

        productGrid.innerHTML = filtered.map((product) => `
          <article class="group overflow-hidden rounded-[24px] border border-white/10 bg-panel card-hover shadow-luxe">
            <div class="relative overflow-hidden">
              <img src="${product.image}" alt="${product.name}" class="product-image w-full transition duration-500 group-hover:scale-105" />
              <span class="absolute left-3 top-3 rounded-full border border-sand/40 bg-[#1b1d21]/85 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-sand">
                ${product.category}
              </span>
            </div>
            <div class="p-5">
              <h4 class="text-lg font-semibold text-bone">${product.name}</h4>
              <div class="mt-3 flex items-center justify-between gap-3">
                <span class="text-xl font-black text-sand">${formatPrice(product.price)}</span>
                <button data-add="${product.id}" class="add-to-cart rounded-full bg-sand px-4 py-2 text-sm font-semibold text-[#111111] transition hover:bg-[#e7ca7a]">
                  + Agregar
                </button>
              </div>
            </div>
          </article>
        `).join('');

        document.querySelectorAll('.add-to-cart').forEach((button) => {
          button.addEventListener('click', () => {
            addToCart(Number(button.dataset.add));
          });
        });
      }

      function addToCart(productId) {
        const product = products.find((item) => item.id === productId);
        if (!product) return;

        const existing = state.cart.find((item) => item.id === productId);
        if (existing) {
          existing.quantity += 1;
        } else {
          state.cart.push({ id: productId, quantity: 1 });
        }

        renderCart();
        openCart();
      }

      function renderCart() {
        cartCount.textContent = String(getCartItemsCount());

        if (!state.cart.length) {
          cartItems.innerHTML = `
            <div class="rounded-2xl border border-dashed border-white/15 bg-[#1D1E23] p-6 text-center">
              <p class="text-base text-bone/70">Tu carrito está vacío.</p>
            </div>
          `;
          totalPrice.textContent = '$0';
          subtotalValue.textContent = '$0';
          discountValue.textContent = '-$0';
          totalValue.textContent = '$0';
          return;
        }

        const cartProducts = state.cart.map((item) => {
          const product = products.find((p) => p.id === item.id);
          return { ...product, quantity: item.quantity };
        });

        const subtotal = cartProducts.reduce((acc, item) => acc + item.price * item.quantity, 0);
        const discount = subtotal * (getDiscountPercent() / 100);
        const total = subtotal - discount;

        totalPrice.textContent = formatPrice(total);
        subtotalValue.textContent = formatPrice(subtotal);
        discountValue.textContent = `-${formatPrice(discount)}`;
        totalValue.textContent = formatPrice(total);

        cartItems.innerHTML = cartProducts.map((item) => `
          <div class="flex items-center gap-3 rounded-2xl border border-white/10 bg-[#1D1E23] p-3">
            <img src="${item.image}" alt="${item.name}" class="h-20 w-20 rounded-xl object-cover" />
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-semibold text-bone">${item.name}</p>
              <p class="mt-1 text-sm text-sand">${formatPrice(item.price)}</p>
            </div>
            <div class="flex items-center gap-2 rounded-full border border-white/10 bg-[#121316] px-2 py-1">
              <button data-action="decrement" data-id="${item.id}" class="qty-btn text-lg text-bone/70 transition hover:text-sand">−</button>
              <span class="min-w-[22px] text-center text-sm font-semibold text-bone">${item.quantity}</span>
              <button data-action="increment" data-id="${item.id}" class="qty-btn text-lg text-bone/70 transition hover:text-sand">＋</button>
            </div>
            <button data-action="remove" data-id="${item.id}" class="ml-1 text-sm text-bone/50 transition hover:text-red-300">Eliminar</button>
          </div>
        `).join('');

        document.querySelectorAll('.qty-btn').forEach((button) => {
          button.addEventListener('click', () => {
            updateQuantity(Number(button.dataset.id), button.dataset.action === 'increment' ? 1 : -1);
          });
        });

        document.querySelectorAll('[data-action="remove"]').forEach((button) => {
          button.addEventListener('click', () => {
            removeFromCart(Number(button.dataset.id));
          });
        });
      }

      function updateQuantity(productId, delta) {
        const item = state.cart.find((product) => product.id === productId);
        if (!item) return;

        item.quantity += delta;
        if (item.quantity <= 0) {
          state.cart = state.cart.filter((product) => product.id !== productId);
        }

        renderCart();
      }

      function removeFromCart(productId) {
        state.cart = state.cart.filter((product) => product.id !== productId);
        renderCart();
      }

      function openCart() {
        cartModal.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
      }

      function closeCart() {
        cartModal.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
      }

      function buildMailBody() {
        const date = new Date().toLocaleString('es-AR');
        const subtotal = state.cart.reduce((acc, item) => {
          const product = products.find((p) => p.id === item.id);
          return acc + product.price * item.quantity;
        }, 0);

        const discountPercent = getDiscountPercent();
        const discount = subtotal * (discountPercent / 100);
        const total = subtotal - discount;

        const paymentText = {
          efectivo: 'Efectivo (-15%)',
          transferencia: 'Transferencia (-10%)',
          tarjeta: 'Tarjeta de crédito/débito',
        }[paymentMethod.value] || 'Tarjeta de crédito/débito';

        const deliveryText = deliveryMethod.value === 'local'
          ? 'Retiro en local (Alfonsina Storni 817, B° Liceo)'
          : 'Envío a domicilio';

        const productsText = state.cart.map((item) => {
          const product = products.find((p) => p.id === item.id);
          return `- ${product.name} | Cantidad: ${item.quantity} | Total: ${formatPrice(product.price * item.quantity)}`;
        }).join('\n');

        const transferBlock = `\nTransferencia:\nAlias: ${ownerAlias}\nTitular: ${ownerName}\nCBU: 0000000000000000000000\nEnviar comprobante a: ${ownerEmail}`;

        const cardText = paymentMethod.value === 'tarjeta'
          ? `\nDatos de tarjeta:\nTitular: ${document.getElementById('cardName').value || 'No ingresado'}\nNúmero: ${document.getElementById('cardNumber').value || 'No ingresado'}\nVencimiento: ${document.getElementById('cardExpiry').value || 'No ingresado'}\nCVV: ${document.getElementById('cardCvv').value || 'No ingresado'}`
          : (paymentMethod.value === 'transferencia' ? transferBlock : '');

        return `Nuevo pedido Herencia Jeans\n\nFecha: ${date}\nCliente: ${customerName.value.trim() || 'Sin nombre'}\nMétodo de pago: ${paymentText}\nEntrega: ${deliveryText}${cardText}\n\nProductos:\n${productsText}\n\nSubtotal: ${formatPrice(subtotal)}\nDescuento: -${formatPrice(discount)}\nTotal: ${formatPrice(total)}`;
      }

      function validateForm() {
        if (!customerName.value.trim()) {
          alert('Ingresá el nombre del cliente para continuar.');
          return false;
        }

        if (paymentMethod.value === 'tarjeta') {
          const cardName = document.getElementById('cardName').value.trim();
          const cardNumber = document.getElementById('cardNumber').value.trim();
          const cardExpiry = document.getElementById('cardExpiry').value.trim();
          const cardCvv = document.getElementById('cardCvv').value.trim();

          if (!cardName || !cardNumber || !cardExpiry || !cardCvv) {
            alert('Completá los datos de la tarjeta para continuar.');
            return false;
          }
        }

        return true;
      }

      async function createStripeCheckoutSession() {
        const checkoutItems = state.cart.map((item) => {
          const product = products.find((p) => p.id === item.id);
          return {
            name: product.name,
            quantity: item.quantity,
            unit_amount: product.price,
          };
        });

        const response = await fetch('/api/create-checkout-session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            items: checkoutItems,
            customerName: customerName.value.trim(),
            deliveryMethod: deliveryMethod.value,
            paymentMethod: paymentMethod.value,
            email: `${customerName.value.trim().toLowerCase().replace(/\s+/g, '.')}@example.com`,
          }),
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'No se pudo crear la sesión de pago.');
        }

        window.location.href = data.url;
      }

      document.querySelectorAll('.filter-btn').forEach((button) => {
        button.addEventListener('click', () => {
          state.activeCategory = button.dataset.category;
          document.querySelectorAll('.filter-btn').forEach((btn) => {
            btn.classList.remove('bg-sand', 'text-[#111111]');
            btn.classList.add('bg-white/5', 'text-bone/80', 'border-white/10');
          });

          button.classList.remove('bg-white/5', 'text-bone/80', 'border-white/10');
          button.classList.add('bg-sand', 'text-[#111111]', 'border-sand/40');

          renderProducts();
        });
      });

      document.getElementById('cartButton').addEventListener('click', openCart);
      document.getElementById('closeCart').addEventListener('click', closeCart);
      cartModal.addEventListener('click', (event) => {
        if (event.target === cartModal) closeCart();
      });

      paymentMethod.addEventListener('change', () => {
        togglePaymentDetails();
        renderCart();
      });

      deliveryMethod.addEventListener('change', renderCart);

      document.getElementById('cardNumber').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})/g, '$1 ').trim();
      });

      document.getElementById('cardExpiry').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 4);
        if (this.value.length >= 2) this.value = this.value.slice(0, 2) + '/' + this.value.slice(2);
      });

      document.getElementById('cardCvv').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 4);
      });

      document.getElementById('checkoutButton').addEventListener('click', async () => {
        if (!state.cart.length) {
          alert('Tu carrito está vacío. Agrega productos antes de finalizar.');
          return;
        }

        if (!validateForm()) return;

        const checkoutButton = document.getElementById('checkoutButton');
        checkoutButton.disabled = true;
        checkoutButton.textContent = 'Procesando...';

        try {
          if (paymentMethod.value === 'tarjeta') {
            await createStripeCheckoutSession();
            return;
          }

          const mailSubject = encodeURIComponent('Pedido Herencia Jeans');
          const mailBody = encodeURIComponent(buildMailBody());
          window.location.href = `mailto:${ownerEmail}?subject=${mailSubject}&body=${mailBody}`;

          setTimeout(() => {
            window.open(`https://wa.me/${ownerPhone}?text=${encodeURIComponent(buildMailBody().replace(/\n/g, '%0A'))}`, '_blank');
          }, 500);
        } catch (error) {
          alert(error.message || 'Hubo un problema al procesar tu pedido.');
        } finally {
          checkoutButton.disabled = false;
          checkoutButton.textContent = 'Enviar pedido al dueño';
        }
      });

      togglePaymentDetails();
      renderProducts();
      renderCart();
    </script>
